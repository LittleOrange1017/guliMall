spring:
  application:
    name: service-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
        group: COMMON_GROUP
        file-extension: yaml
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
    gateway:
      routes:
        - id: third_party_route
          uri: lb://service-thirdparty
          predicates:
            - Path=/api/third/party/**
          filters:
            - RewritePath=/api/third/party/(?<segment>.*), /$\{segment}
        - id: product_route
          uri: lb://service-product
          predicates:
            - Path=/api/product/**
          filters:
            - RewritePath=/api/product/(?<segment>.*), /product/$\{segment}
        - id: member_route
          uri: lb://service-member
          predicates:
            - Path=/api/member/**
          filters:
              - RewritePath=/api/member/(?<segment>.*), /member/$\{segment}
        - id: ware-route
          uri: lb://service-ware
          predicates:
            - Path=/api/ware/**
          filters:
            - RewritePath=/api/ware/(?<segment>.*), /ware/$\{segment}
        - id: admin_route
          uri: lb://service-renrenfast
          predicates:
            - Path=/api/**
          filters:
            - RewritePath=/api/(?<segment>.*), /renren-fast/$\{segment}
        - id: Search_host_route
          uri: lb://service-search
          predicates:
            - Host=search.littleorange.com
        - id: littleOrange_host_route
          # lb:// 代表使用负载均衡，找 Nacos 中名为 gulimall-product 的服务
          uri: lb://service-product
          predicates:
            # 【关键魔法】：如果请求头中的 Host 头是 littleOrange.com，就匹配这个路由！
            # 这就是为什么上面 Nginx 配置里必须要有 proxy_set_header Host $host 的原因
            - Host=littleorange.com,item.littleorange.com
