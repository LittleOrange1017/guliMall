<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>小橘子商城登录页面</title>
    <script src="/static/reg/libs/jquery-1.12.4.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="/static/reg/js/jQuery/jquery-3.1.1.js"></script>
    <link rel="stylesheet" type="text/css" href="/static/reg/bootStrap/bootstrap/css/bootstrap.css"/>
    <style>
        /* 全局重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .login-header {
            background: #ffffff;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
            z-index: 100;
        }

        .login-header .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .login-header .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #e3393c;
            letter-spacing: 1px;
        }

        .login-header .welcome-text {
            font-size: 14px;
            color: #57606f;
            font-weight: 500;
        }

        /* 主内容区域 */
        .login-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* 登录卡片容器 */
        .login-card-container {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            position: relative;
            z-index: 10;
        }

        /* 装饰性顶部条 */
        .login-card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e3393c, #ff6b6b);
            border-radius: 12px 12px 0 0;
        }

        /* 标题美化 */
        .login-card-title {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* 登录方式切换 */
        .login-tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .login-tab {
            font-size: 15px;
            font-weight: 600;
            color: #a4b0be;
            cursor: pointer;
            transition: all 0.3s ease;
            padding-bottom: 15px;
            position: relative;
        }

        .login-tab.active {
            color: #e3393c;
        }

        .login-tab.active::after {
            content: '';
            position: absolute;
            bottom: -17px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e3393c;
            border-radius: 1px;
        }

        .login-tab:hover {
            color: #e3393c;
        }

        /* 登录表单区域 */
        .login-form-section {
            display: none;
        }

        .login-form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 单个输入组布局 */
        .login-form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .login-form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #57606f;
            margin-bottom: 8px;
        }

        /* 输入框样式与过渡动画 */
        .login-input-control {
            width: 100%;
            padding: 12px 16px;
            padding-left: 44px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            font-size: 14px;
            color: #2f3542;
            background-color: #fafafa;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
            box-sizing: border-box;
        }

        /* 输入框聚焦时的呼吸灯高亮效果 */
        .login-input-control:focus {
            border-color: #e3393c;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(227, 57, 60, 0.12);
        }

        /* 输入框悬停效果 */
        .login-input-control:hover {
            border-color: #a4b0be;
            background-color: #ffffff;
        }

        /* 输入框图标 */
        .input-icon {
            position: absolute;
            left: 14px;
            top: 38px;
            color: #a4b0be;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .login-form-group:focus-within .input-icon {
            color: #e3393c;
        }

        /* 记住密码与忘记密码 */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #57606f;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #e3393c;
            cursor: pointer;
        }

        .forgot-password {
            color: #e3393c;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #c51e25;
            text-decoration: underline;
        }

        /* 登录提交按钮 */
        .login-submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #e3393c;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-submit-btn:hover {
            background-color: #c51e25;
            box-shadow: 0 6px 20px rgba(227, 57, 60, 0.3);
        }

        .login-submit-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(227, 57, 60, 0.2);
        }

        /* 错误提示样式 */
        .login-error-msg {
            display: none;
            color: #ff4757;
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        /* 扫码登录区域 */
        .qrcode-section {
            text-align: center;
            padding: 20px 0;
        }

        .qrcode-section .qrcode-placeholder {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            background: #f8f9fa;
            border: 2px dashed #ced6e0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a4b0be;
            font-size: 14px;
        }

        .qrcode-section .qrcode-tips {
            font-size: 13px;
            color: #57606f;
            margin-bottom: 20px;
        }

        .qrcode-section .qrcode-features {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 12px;
            color: #a4b0be;
        }

        .qrcode-section .qrcode-features span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qrcode-section .qrcode-features .feature-icon {
            color: #e3393c;
        }

        /* 第三方登录 */
        .third-party-login {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            text-align: center;
        }

        .third-party-login .divider-text {
            font-size: 12px;
            color: #a4b0be;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 0 15px;
            position: relative;
            top: -32px;
        }

        .third-party-login .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: -10px;
        }

        .third-party-login .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #57606f;
            font-size: 18px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }

        .third-party-login .social-icon:hover {
            background: #e3393c;
            color: #ffffff;
            border-color: #e3393c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(227, 57, 60, 0.2);
        }

        /* 注册链接 */
        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #57606f;
        }

        .register-link a {
            color: #e3393c;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #c51e25;
            text-decoration: underline;
        }

        /* 底部信息 */
        .login-footer {
            background: #ffffff;
            padding: 20px 40px;
            text-align: center;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
        }

        .login-footer .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .login-footer .footer-links a {
            font-size: 12px;
            color: #57606f;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .login-footer .footer-links a:hover {
            color: #e3393c;
        }

        .login-footer .copyright {
            font-size: 12px;
            color: #a4b0be;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .login-header {
                padding: 12px 20px;
            }

            .login-header .logo-text {
                font-size: 18px;
            }

            .login-main {
                padding: 20px 16px;
            }

            .login-card-container {
                padding: 30px 20px;
                border-radius: 8px;
            }

            .login-card-title {
                font-size: 20px;
            }

            .login-tabs {
                gap: 20px;
            }

            .login-tab {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .login-card-container {
                padding: 24px 16px;
            }

            .login-options {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .third-party-login .social-icons {
                gap: 16px;
            }

            .login-footer .footer-links {
                gap: 12px;
            }
        }
    </style>

</head>

<body>

    <!-- 顶部导航栏 -->
    <header class="login-header">
        <div class="logo-section">
            <span class="logo-text">小橘子商城</span>
            <span class="welcome-text">欢迎登录</span>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="login-main">
        <div class="login-card-container">
            <h1 class="login-card-title">用户登录</h1>

            <!-- 登录方式切换 -->
            <div class="login-tabs">
                <div class="login-tab active" data-tab="qrcode">扫码登录</div>
                <div class="login-tab" data-tab="account">账户登录</div>
            </div>

            <!-- 扫码登录 -->
            <div class="login-form-section active" id="qrcode-section">
                <div class="qrcode-section">
                    <div class="qrcode-placeholder">
                        <span>二维码区域</span>
                    </div>
                    <p class="qrcode-tips">打开<span style="color: #e3393c; font-weight: 600;">手机小橘子商城</span>扫描二维码</p>
                    <div class="qrcode-features">
                        <span><span class="feature-icon">✓</span> 免输入</span>
                        <span><span class="feature-icon">✓</span> 更快</span>
                        <span><span class="feature-icon">✓</span> 更安全</span>
                    </div>
                </div>
            </div>

            <!-- 账户登录 -->
            <div class="login-form-section" id="account-section">
                <form id="loginForm" action="/login" method="post">
                    <div class="login-form-group">
                        <label for="username">账户名</label>
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" class="login-input-control"
                               placeholder="邮箱/用户名/已验证手机" required>
                        <span class="login-error-msg" id="username-error">请输入账户名</span>
                    </div>

                    <div class="login-form-group">
                        <label for="password">密码</label>
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" class="login-input-control"
                               placeholder="请输入密码" required>
                        <span class="login-error-msg" id="password-error">请输入密码</span>
                    </div>

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember-me"> 记住密码
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>

                    <button type="submit" class="login-submit-btn">登 录</button>
                </form>

                <!-- 第三方登录 -->
                <div class="third-party-login">
                    <div style="border-top: 1px solid #f0f0f0; position: relative;">
                        <span class="divider-text">其他登录方式</span>
                    </div>
                    <div class="social-icons">
                        <div class="social-icon" title="QQ登录">Q</div>
                        <div class="social-icon" title="微信登录">W</div>
                    </div>
                </div>

                <!-- 注册链接 -->
                <div class="register-link">
                    还没有账号？<a href="http://auth.littleorange.com/reg">立即注册</a>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部信息 -->
    <footer class="login-footer">
        <div class="footer-links">
            <a href="#">关于我们</a>
            <a href="#">联系我们</a>
            <a href="#">人才招聘</a>
            <a href="#">商家入驻</a>
            <a href="#">广告服务</a>
            <a href="#">友情链接</a>
        </div>
        <div class="copyright">
            Copyright &copy; 2004-2026 小橘子商城gulimall.com 版权所有
        </div>
    </footer>

    <script type="text/javascript">
        // 登录方式切换
        const tabs = document.querySelectorAll('.login-tab');
        const sections = document.querySelectorAll('.login-form-section');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // 移除所有 active 状态
                tabs.forEach(t => t.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));

                // 添加当前 active 状态
                this.classList.add('active');
                const targetSection = document.getElementById(this.dataset.tab + '-section');
                if (targetSection) {
                    targetSection.classList.add('active');
                }
            });
        });

        // 表单验证
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('username-error');
        const passwordError = document.getElementById('password-error');

        loginForm.addEventListener('submit', function(e) {
            let isValid = true;

            // 验证用户名
            if (!usernameInput.value.trim()) {
                usernameError.style.display = 'block';
                usernameInput.style.borderColor = '#ff4757';
                isValid = false;
            } else {
                usernameError.style.display = 'none';
                usernameInput.style.borderColor = '#ced6e0';
            }

            // 验证密码
            if (!passwordInput.value.trim()) {
                passwordError.style.display = 'block';
                passwordInput.style.borderColor = '#ff4757';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
                passwordInput.style.borderColor = '#ced6e0';
            }

            if (!isValid) {
                e.preventDefault();
            }
        });

        // 输入框聚焦时清除错误
        usernameInput.addEventListener('focus', function() {
            usernameError.style.display = 'none';
            this.style.borderColor = '#e3393c';
        });

        passwordInput.addEventListener('focus', function() {
            passwordError.style.display = 'none';
            this.style.borderColor = '#e3393c';
        });
    </script>

</body>
</html>
