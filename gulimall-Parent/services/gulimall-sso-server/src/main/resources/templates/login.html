<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>谷粒统一认证中心</title>
</head>
<body>
<div style="text-align: center; margin-top: 100px;">
    <h2>谷粒商圈 - 统一认证中心</h2>
    <form action="/doLogin" method="post">
        用户名：<input type="text" name="username" value="admin"/><br/><br/>
        密&nbsp;&nbsp;码：<input type="password" name="password" value="123456"/><br/><br/>
        <input type="hidden" name="redirect_url" th:value="${url}"/>
        <button type="submit">安全登录</button>
    </form>
</div>
</body>
</html>
