spring:
  cache:
    type: redis
    redis:
      time-to-live: 30000
      key-prefix: CACHE_
      use-key-prefix: false
  application:
    name: service-productB
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
        file-extension: yaml
        group: service-productB
        extension-configs:
          - data-id: mybatis.yaml
            refresh: true
            group: COMMON_GROUP
          - data-id: datasource-common.yaml
            refresh: true
            group: COMMON_GROUP
          - data-id: redis-common.yaml
            refresh: true
            group: COMMON_GROUP
          - data-id: thread.yaml
            refresh: true
            group: COMMON_GROUP
          - data-id: session.yaml
            refresh: true
            group: COMMON_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
  thymeleaf:
    cache: false
server:
  port: 10002
logging:
  level:
    com.xjz.gulimall: info