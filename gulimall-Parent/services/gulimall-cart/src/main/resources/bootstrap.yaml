spring:
  application:
    name: service-cart
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
        file-extension: yaml
        group: service-cart
        extension-configs:
          - data-id: redis-common.yaml
            refresh: true
            group: COMMON_GROUP
          - data-id: session.yaml
            refresh: true
            group: COMMON_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
  profiles:
    active: dev
  thymeleaf:
    cache: false