spring:
  thymeleaf:
    cache: false
  application:
    name: service-search
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
        file-extension: yaml
        group: service-search
        extension-configs:
          - data-id: redis-common.yaml
            refresh: true
            group: COMMON_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev-namespace-uuid
logging:
  level:
    com.xjz.gulimall: debug